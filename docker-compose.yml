version: '3.8'

services:
  # Web API 服务
  api:
    build: .
    container_name: precious_insight_api
    command: python app.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - app_network

  # Streamlit Dashboard
  dashboard:
    build: .
    container_name: precious_insight_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
    networks:
      - app_network

  # Celery Worker (处理异步任务)
  worker:
    build: .
    container_name: precious_insight_worker
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - app_network

  # Celery Beat (定时任务调度)
  beat:
    build: .
    container_name: precious_insight_beat
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - app_network

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: precious_insight_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
