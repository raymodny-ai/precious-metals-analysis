apiVersion: v1
kind: Service
metadata:
  name: precious-metals-api
  namespace: precious-metals
  labels:
    app: precious-metals
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
    - port: 8001
      targetPort: 8001
      name: metrics
  selector:
    app: precious-metals
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: precious-metals-frontend
  namespace: precious-metals
  labels:
    app: precious-metals
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: precious-metals
    component: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: precious-metals-ingress
  namespace: precious-metals
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - precious-metals.example.com
        - api.precious-metals.example.com
      secretName: precious-metals-tls
  rules:
    - host: precious-metals.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: precious-metals-frontend
                port:
                  number: 3000
    - host: api.precious-metals.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: precious-metals-api
                port:
                  number: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: precious-metals-config
  namespace: precious-metals
data:
  kafka-servers: "kafka:9092"
  redis-host: "redis"
  redis-port: "6379"
  log-level: "INFO"
  environment: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: precious-metals-secrets
  namespace: precious-metals
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/precious_metals"
  redis-url: "redis://redis:6379/0"
  deepseek-api-key: "<YOUR_DEEPSEEK_API_KEY>"
  jwt-secret: "<YOUR_JWT_SECRET_KEY>"
  fred-api-key: "<YOUR_FRED_API_KEY>"
  news-api-key: "<YOUR_NEWS_API_KEY>"
---
apiVersion: v1
kind: Namespace
metadata:
  name: precious-metals
  labels:
    name: precious-metals
