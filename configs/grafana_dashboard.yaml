# Grafana Dashboard Configuration
# Precious Metals Analysis System

apiVersion: 1

providers:
  - name: 'Precious Metals'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards

---
# Dashboard JSON
# Save as precious_metals_dashboard.json

{
  "annotations": {
    "list": []
  },
  "editable": true,
  "fiscalYearStartMonth": 0,
  "graphTooltip": 0,
  "id": null,
  "links": [],
  "liveNow": false,
  "panels": [
    {
      "title": "Data Collection Status",
      "type": "stat",
      "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
      "targets": [
        {
          "expr": "sum(rate(precious_metals_data_fetch_total{status=\"success\"}[5m]))",
          "legendFormat": "Fetches/min"
        }
      ]
    },
    {
      "title": "API Request Rate",
      "type": "graph",
      "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
      "targets": [
        {
          "expr": "sum(rate(precious_metals_api_requests_total[5m])) by (endpoint)",
          "legendFormat": "{{endpoint}}"
        }
      ]
    },
    {
      "title": "Current Sentiment",
      "type": "gauge",
      "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
      "targets": [
        {
          "expr": "precious_metals_current_sentiment{symbol=\"GLD\"}",
          "legendFormat": "GLD Sentiment"
        }
      ],
      "options": {
        "minValue": -1,
        "maxValue": 1
      }
    },
    {
      "title": "Prediction Latency",
      "type": "histogram",
      "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
      "targets": [
        {
          "expr": "histogram_quantile(0.95, rate(precious_metals_prediction_latency_seconds_bucket[5m]))",
          "legendFormat": "p95"
        },
        {
          "expr": "histogram_quantile(0.50, rate(precious_metals_prediction_latency_seconds_bucket[5m]))",
          "legendFormat": "p50"
        }
      ]
    },
    {
      "title": "ETF Alerts",
      "type": "table",
      "gridPos": {"h": 6, "w": 12, "x": 0, "y": 12},
      "targets": [
        {
          "expr": "sum(precious_metals_etf_alerts_total) by (symbol, severity)",
          "format": "table"
        }
      ]
    },
    {
      "title": "Model Accuracy",
      "type": "stat",
      "gridPos": {"h": 4, "w": 6, "x": 12, "y": 12},
      "targets": [
        {
          "expr": "precious_metals_model_accuracy{metric_type=\"mae\"}",
          "legendFormat": "{{model}} MAE"
        }
      ]
    },
    {
      "title": "Backtest Performance",
      "type": "graph",
      "gridPos": {"h": 6, "w": 12, "x": 12, "y": 16},
      "targets": [
        {
          "expr": "precious_metals_backtest_sharpe_ratio",
          "legendFormat": "{{strategy}} Sharpe"
        }
      ]
    },
    {
      "title": "WebSocket Connections",
      "type": "stat",
      "gridPos": {"h": 4, "w": 6, "x": 18, "y": 12},
      "targets": [
        {
          "expr": "sum(precious_metals_websocket_connections)",
          "legendFormat": "Active Connections"
        }
      ]
    }
  ],
  "refresh": "30s",
  "schemaVersion": 38,
  "style": "dark",
  "tags": ["precious-metals", "monitoring"],
  "templating": {
    "list": [
      {
        "name": "symbol",
        "type": "query",
        "query": "label_values(precious_metals_current_sentiment, symbol)",
        "multi": true
      }
    ]
  },
  "time": {
    "from": "now-6h",
    "to": "now"
  },
  "title": "Precious Metals Analysis Dashboard",
  "uid": "precious-metals-main"
}
